<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HASE Skills Study</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --ink: #1d1d1b; --mut: #66655f; --line: #dddbd3; --soft: #efede6;
    --accent: #1f5c4a; --accent-ink: #ffffff; --best: #1f6f43; --worst: #a33a2c; --warn-bg: #fbeee9;
    --focus: #2f6fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #201f1d; --ink: #ecebe6; --mut: #a5a39b; --line: #3a3934; --soft: #2a2926;
      --accent: #6fc1a2; --accent-ink: #10201a; --best: #79cf9d; --worst: #f08d7e; --warn-bg: #3a2521;
      --focus: #8ab4ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  header b { letter-spacing: .06em; font-size: 13px; margin-right: 6px; }
  .pill { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--mut); }
  .pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .pill.done { color: var(--accent); border-color: var(--accent); }
  main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 80px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  h1 { font-size: 24px; margin: 0 0 6px; line-height: 1.25; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  .mut { color: var(--mut); }
  .small { font-size: 14px; }
  .err { background: var(--warn-bg); border: 1px solid var(--worst); color: var(--ink); border-radius: 8px;
         padding: 10px 14px; margin-bottom: 16px; }
  button { font: inherit; font-size: 15px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
           color: var(--ink); padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, label.msg:focus-within {
    outline: 2px solid var(--focus); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 10px 18px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.chip { border-radius: 99px; padding: 5px 12px; font-size: 14px; }
  button.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button.best.on { background: var(--best); color: #fff; border-color: var(--best); }
  button.worst.on { background: var(--worst); color: #fff; border-color: var(--worst); }
  input[type=text], textarea, select { font: inherit; font-size: 15px; width: 100%; padding: 8px 10px; border-radius: 8px;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  textarea { min-height: 64px; resize: vertical; }
  label.field { display: block; font-size: 14px; color: var(--mut); margin: 12px 0 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spread { justify-content: space-between; }
  .day { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  label.msg { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 6px; border-radius: 6px; cursor: pointer; }
  label.msg:hover { background: var(--soft); }
  label.msg input { margin-top: 4px; width: 16px; height: 16px; }
  label.msg.off .txt { text-decoration: line-through; color: var(--mut); }
  .ai { display: block; font-size: 13px; color: var(--mut); margin-top: 2px; }
  .task { background: var(--soft); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin: 14px 0; }
  .answer { border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-width: 0; }
  .answer .head { padding: 8px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .answer .body { padding: 12px; overflow-wrap: anywhere; flex: 1; max-height: 520px; overflow: auto; }
  .answer .body p { margin: 0 0 8px; }
  .answer .body ul, .answer .body ol { margin: 0 0 8px; padding-left: 20px; }
  .answer .body li { margin-bottom: 3px; }
  .answer .body .h { font-weight: 700; margin: 10px 0 4px; }
  .answer .body .h:first-child { margin-top: 0; }
  .answer .foot { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .badge { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; color: var(--mut); }
  .kv { margin: 6px 0 0; }
  .kv b { color: var(--mut); font-weight: 600; margin-right: 4px; }
  .sets { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin: 12px 0; }
  .sets ul { margin: 0; padding-left: 18px; }
  .sets li { margin-bottom: 8px; }
  .status { font-size: 12px; color: var(--mut); }
  pre.log { background: var(--soft); border-radius: 8px; padding: 10px; font-size: 12.5px; white-space: pre-wrap;
            max-height: 260px; overflow: auto; }
  .spinner { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
             animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sticky { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
            margin: 16px -20px -20px; padding: 12px 20px; border-radius: 0 0 10px 10px; }
  .hidden { display: none !important; }
  a { color: var(--accent); }
  code { font-size: 13px; background: var(--soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <b>HASE STUDY</b>
  <span class="pill" data-p="review">1 Check what is sent</span>
  <span class="pill" data-p="start">2 Generate</span>
  <span class="pill" data-p="compare">3 Compare answers</span>
  <span class="pill" data-p="confirm">4 Your skills</span>
  <span class="pill" data-p="choose">5 Choose a set</span>
  <span class="pill" data-p="done">6 Done</span>
</header>
<main>
  <div id="error" class="err hidden" role="alert"></div>
  <div id="view"><div class="panel"><span class="spinner"></span>Loading…</div></div>
</main>

<script>
const TOKEN = "__TOKEN__";
const ORDER = ["review", "start", "compare", "confirm", "choose", "done"];
let S = null, poll = null, ui = {};

const $ = (id) => document.getElementById(id);
/* Answers come back as Markdown. Show bold, headings and lists instead of ** and -. Text is escaped first,
   so nothing in an answer can become HTML. */
function md(text) {
  const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<i>$2</i>")
                              .replace(/`([^`]+)`/g, "<code>$1</code>");
  const out = []; let list = null, para = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
  for (const raw of String(text ?? "").split("\n")) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushPara(); flushList(); continue; }
    if ((m = line.match(/^\s*#{1,6}\s+(.*)$/)) || (m = line.match(/^\s*\*\*([^*]+)\*\*:?\s*$/))) {
      flushPara(); flushList(); out.push(`<div class="h">${inline(m[1])}</div>`); continue; }
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/), num = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (bullet || num) {
      flushPara(); const tag = bullet ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = {tag, items: []}; }
      list.items.push((bullet || num)[1]); continue; }
    if (list && /^\s{2,}/.test(raw)) { list.items[list.items.length - 1] += " " + line.trim(); continue; }
    flushList(); para.push(line);
  }
  flushPara(); flushList();
  return out.join("");
}
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

async function api(path, body) {
  const res = await fetch("/api/" + path, {
    method: body === undefined ? "GET" : "POST",
    headers: {"X-Study-Token": TOKEN, "Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await res.json().catch(() => ({error: "The local study server stopped. Run the same command again in the terminal."}));
  if (!res.ok || data.error && data.phase !== "error") throw new Error(data.error || "Something went wrong.");
  return data;
}
function showError(msg) { const e = $("error"); e.textContent = msg; e.classList.toggle("hidden", !msg); if (msg) e.scrollIntoView({block: "nearest"}); }
async function act(path, body, btn) {
  showError("");
  if (btn) btn.disabled = true;
  try { S = await api(path, body); ui = {}; render(); window.scrollTo(0, 0); }
  catch (e) { showError(e.message); }
  finally { if (btn) btn.disabled = false; }
}
async function refresh() {
  try { S = await api("state"); showError(S.phase === "error" ? S.error : ""); render(); }
  catch (e) { showError(e.message); }
}

function pills() {
  const cur = S.phase === "working" ? "start" : S.phase;
  const i = ORDER.indexOf(cur);
  document.querySelectorAll(".pill").forEach((p) => {
    const j = ORDER.indexOf(p.dataset.p);
    p.classList.toggle("on", j === i); p.classList.toggle("done", i >= 0 && j < i);
  });
}

function render() {
  pills();
  clearInterval(poll);
  if (S.phase === "working") poll = setInterval(refresh, 2000);
  if (S.phase === "error") { $("view").innerHTML = ""; return; }
  ({review, start: startView, working: startView, compare, confirm, choose, done})[S.phase]();
}

/* ---------------------------------------------------------------- 1 review */
function review() {
  ui.removed = ui.removed || new Set(); ui.removedTasks = ui.removedTasks || new Set();
  const total = S.days.reduce((n, d) => n + d.length, 0);
  const days = S.days.map((d, i) => `
    <div class="day"><h3>Day ${i + 1} of ${S.days.length}</h3>
    ${d.map((m) => `<label class="msg ${ui.removed.has(m.id) ? "off" : ""}"><input type="checkbox" data-m="${esc(m.id)}" ${ui.removed.has(m.id) ? "" : "checked"}>
      <span><span class="txt">${esc(m.text)}</span>${m.ai ? `<span class="ai">after the assistant said: …${esc(m.ai)}</span>` : ""}</span></label>`).join("")}
    </div>`).join("");
  const replay = S.replay.map((t) => `<label class="msg ${ui.removedTasks.has(t.task_id) ? "off" : ""}"><input type="checkbox" data-t="${esc(t.task_id)}" ${ui.removedTasks.has(t.task_id) ? "" : "checked"}>
      <span><span class="txt">${esc(t.text)}</span><span class="ai">${esc(t.task_id)} · first message of a chat on ${esc(t.date)}</span></span></label>`).join("");
  $("view").innerHTML = `
    <div class="panel">
      <h1>Check what will be sent</h1>
      <p>Nothing has been sent yet. Below are the messages picked from your ${esc(S.engine)} history. Only the ticked ones
      are sent, to <b>your own ${esc(S.engine)} account</b>; the researchers never receive them. Untick anything personal or
      anything you would rather not send.</p>
      <p class="mut small">Grey lines are the end of the assistant's previous reply, shown so a short correction like "shorter" makes sense. They are sent together with the message.</p>
      ${days}
    </div>
    <div class="panel">
      <h2>Tasks the AI will answer</h2>
      <p class="mut small">You do not solve these. The AI answers each one three ways and you compare the answers in step 3.</p>
      <h3>Common tasks, the same for everyone</h3>
      ${S.common.map((t) => `<p class="small"><b>${esc(t.task_id)}</b> ${esc(t.text.split("\n")[0])}</p>`).join("")}
      ${S.replay.length ? `<h3 style="margin-top:16px">From your own recent chats</h3>
      <p class="mut small">Keep a task only if you are happy for it to be sent and you could judge answers to it.</p>${replay}` : ""}
      <label class="field" for="own">Optional: a question you would really ask an AI (added as one more task)</label>
      <textarea id="own" placeholder="Leave empty to skip">${esc(ui.own ?? S.own)}</textarea>
      <div class="sticky row spread">
        <span id="count" class="small"></span>
        <button class="primary" id="send">Send the ticked items</button>
      </div>
    </div>`;
  const count = () => {
    const n = total - ui.removed.size, t = S.replay.length - ui.removedTasks.size;
    $("count").textContent = `${n} of ${total} messages and ${S.common.length + t} tasks ticked`;
    $("send").textContent = `Send these to my ${S.engine} account`;
  };
  document.querySelectorAll("input[data-m]").forEach((c) => c.onchange = () => {
    c.checked ? ui.removed.delete(c.dataset.m) : ui.removed.add(c.dataset.m);
    c.closest("label").classList.toggle("off", !c.checked); count();
  });
  document.querySelectorAll("input[data-t]").forEach((c) => c.onchange = () => {
    c.checked ? ui.removedTasks.delete(c.dataset.t) : ui.removedTasks.add(c.dataset.t);
    c.closest("label").classList.toggle("off", !c.checked); count();
  });
  $("own").oninput = (e) => ui.own = e.target.value;
  $("send").onclick = (e) => act("review", {remove_messages: [...ui.removed], remove_tasks: [...ui.removedTasks],
                                            own_question: $("own").value}, e.target);
  count();
}

/* ---------------------------------------------------------------- 2 generate + answers */
function startView() {
  const j = S.job, running = S.phase === "working";
  $("view").innerHTML = `
    <div class="panel">
      <h1>Generate skills and answers</h1>
      <p>${esc(S.engine)} now does two things with your own login: it writes two sets of skills from the messages you approved,
      using two different methods, and then answers each task three ways (with no skills, and with each set). You do not
      need to do anything; it usually takes 5 to 10 minutes. You can leave this page open and come back.</p>
      ${running ? `<p><span class="spinner"></span><b>${j.step === "answers" ? "Writing the answers…" : "Writing the skills…"}</b></p>`
                : `<button class="primary" id="go">${j.error ? "Try again (continues where it stopped)" : "Start"}</button>`}
      ${j.error ? `<div class="err" style="margin-top:14px">${esc(j.error)}</div>` : ""}
      ${j.log ? `<h3 style="margin-top:16px">Progress</h3><pre class="log">${esc(j.log)}</pre>` : ""}
    </div>`;
  if (!running) $("go").onclick = (e) => act("start", {}, e.target);
}

/* ---------------------------------------------------------------- 3 compare */
function compare() {
  const tasks = S.tasks;
  if (ui.i === undefined || ui.i < 0) { const k = tasks.findIndex((t) => !t.done); ui.i = k < 0 ? 0 : k; }
  const t = tasks[ui.i];
  if (!ui.d || ui.d.task_id !== t.task_id) {
    const prev = t.done && !t.done.result ? t.done : null;
    ui.d = {task_id: t.task_id, best: prev ? prev.best : "", worst: prev ? prev.worst : "", clarity: prev ? prev.clarity : "",
            tags: prev ? (prev.tags || "").split(" ").filter(Boolean) : [], reason: prev ? prev.reason : ""};
  }
  const d = ui.d, two = t.answers.length === 2;
  const status = t.done ? (t.done.result ? `saved as ${t.done.result}` : "saved") : "";
  $("view").innerHTML = `
    <div class="panel">
      <div class="row spread"><h3>Task ${ui.i + 1} of ${tasks.length}${t.kind === "replay" ? " · from your own chat" : t.kind === "own" ? " · your own question" : ""}</h3>
      <span class="small mut">${tasks.filter((x) => x.done).length} of ${tasks.length} done${status ? " · this one " + status : ""}</span></div>
      <p class="small mut">All answers are to the same task, shown in random order. The letters do not say how an answer was written.
      Pick the answer you would most like to receive${two ? "" : ", and the one you would least like"}.</p>
      <div class="task">${esc(t.task)}</div>
      <div class="grid">${t.answers.map((a) => `
        <div class="answer"><div class="head">Answer ${a.slot}</div><div class="body">${md(a.text)}</div>
        <div class="foot"><button class="chip best ${d.best === a.slot ? "on" : ""}" data-best="${a.slot}">Best</button>
        ${two ? "" : `<button class="chip worst ${d.worst === a.slot ? "on" : ""}" data-worst="${a.slot}">Worst</button>`}</div></div>`).join("")}
      </div>
      <div>
        <label class="field">How clear was the difference?</label>
        <div class="row">${[["clear", "clear"], ["slight", "slight"], ["forced", "forced: I had to pick but could hardly tell"]].map(([v, l]) =>
          `<button class="chip ${d.clarity === v ? "on" : ""}" data-clarity="${v}">${l}</button>`).join("")}</div>
        <label class="field">What made the difference? Choose all that apply.</label>
        <div class="row">${S.tags.map((g) => `<button class="chip ${d.tags.includes(g.id) ? "on" : ""}" data-tag="${g.id}">${esc(g.label)}</button>`).join("")}</div>
        <label class="field" for="reason">In one line, why? (required)</label>
        <input type="text" id="reason" value="${esc(d.reason)}" placeholder="What made the best better or the worst worse?">
      </div>
      <div class="sticky row spread">
        <div class="row">
          <button id="back" ${ui.i === 0 ? "disabled" : ""}>← Back</button>
          <button id="tie" title="You cannot tell them apart">Tie: cannot tell</button>
          <button id="skip" title="The task itself is unfair or unclear">Skip: not a fair task</button>
        </div>
        <button class="primary" id="save">Save and next →</button>
      </div>
    </div>`;
  const rerender = () => { d.reason = $("reason").value; showError(""); compare(); };
  document.querySelectorAll("[data-best]").forEach((b) => b.onclick = () => { d.best = b.dataset.best; if (d.worst === d.best) d.worst = ""; rerender(); });
  document.querySelectorAll("[data-worst]").forEach((b) => b.onclick = () => { d.worst = b.dataset.worst; if (d.best === d.worst) d.best = ""; rerender(); });
  document.querySelectorAll("[data-clarity]").forEach((b) => b.onclick = () => { d.clarity = b.dataset.clarity; rerender(); });
  document.querySelectorAll("[data-tag]").forEach((b) => b.onclick = () => {
    const g = b.dataset.tag; d.tags = d.tags.includes(g) ? d.tags.filter((x) => x !== g) : [...d.tags, g]; rerender(); });
  $("reason").oninput = (e) => d.reason = e.target.value;
  $("back").onclick = () => { ui.i -= 1; ui.d = null; showError(""); compare(); };
  const send = async (body, btn) => {
    showError(""); btn.disabled = true;
    try {
      S = await api("compare", {task_id: t.task_id, ...body});
      if (S.phase !== "compare") { ui = {}; render(); window.scrollTo(0, 0); return; }
      const next = S.tasks.findIndex((x, k) => k > ui.i && !x.done);
      ui.i = next >= 0 ? next : S.tasks.findIndex((x) => !x.done); ui.d = null; compare(); window.scrollTo(0, 0);
    } catch (e) { showError(e.message); btn.disabled = false; }
  };
  $("tie").onclick = (e) => {
    const why = prompt("Why can't you tell them apart? (optional)", ""); if (why === null) return;
    send({result: "tie", reason: why}, e.target);
  };
  $("skip").onclick = (e) => {
    const why = prompt("What is wrong with this task? (optional)", ""); if (why === null) return;
    send({result: "skip", question_note: why}, e.target);
  };
  $("save").onclick = (e) => {
    d.reason = $("reason").value.trim();
    if (!d.best || (!two && !d.worst)) return showError(two ? "Pick the Best answer, or press Tie or Skip." : "Pick a Best and a Worst answer, or press Tie or Skip.");
    if (!d.clarity) return showError("Say how clear the difference was.");
    if (!d.tags.length || !d.reason) return showError("Choose what made the difference and write one line on why.");
    send({best: d.best, worst: two ? "" : d.worst, clarity: d.clarity, tags: d.tags, reason: d.reason}, e.target);
  };
}

/* ---------------------------------------------------------------- 4 confirm */
function confirm() {
  ui.dec = ui.dec || {}; ui.added = ui.added || []; ui.refl = ui.refl || {surprise: "", missing: ""};
  $("view").innerHTML = `
    <div class="panel">
      <h1>The skills written from your messages</h1>
      <p>You now see them for the first time: ${S.cards.length} items, written by both methods and mixed together. They were
      the guidance behind the answers you just compared.</p>
      <p><b>How to decide:</b> judge each item on its own. Keep it if it describes how you work and you would want an
      assistant to follow it from now on; delete it if not, or edit it so it fits. If two items say much the same,
      judge each separately and keep both if both are true. Do not try to guess which method wrote it.</p>
      <p class="small mut">A short note on what is right or wrong about each helps us most. In the next step you see the
      same items again, split into the two groups they came from.</p>
      ${S.cards.map((c, i) => { const e = ui.dec[c.card_id] || {}; return `
        <div class="card">
          <div class="row spread"><b>${i + 1}. ${esc(c.title)}</b><span class="badge">${esc(c.type)}</span></div>
          <p class="kv small"><b>When</b>${esc(c.when)}</p><p class="kv small"><b>Do</b>${esc(c.instruction)}</p>
          <div class="row" style="margin-top:10px">${["keep", "edit", "delete"].map((v) =>
            `<button class="chip ${e.decision === v ? "on" : ""}" data-dec="${c.card_id}" data-v="${v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join("")}</div>
          ${e.decision === "edit" ? `<label class="field">When it applies</label><textarea data-edit="${c.card_id}" data-k="when">${esc(e.when ?? c.when)}</textarea>
            <label class="field">What to do</label><textarea data-edit="${c.card_id}" data-k="instruction">${esc(e.instruction ?? c.instruction)}</textarea>` : ""}
          <label class="field">What is right or wrong about it? (optional, your own words)</label>
          <input type="text" data-comment="${c.card_id}" value="${esc(e.comment || "")}">
        </div>`; }).join("")}
    </div>
    <div class="panel">
      <h2>Two short questions about the skills as a whole</h2>
      <label class="field" for="surprise">Which one surprised you most, and why? (write none if none)</label>
      <textarea id="surprise">${esc(ui.refl.surprise)}</textarea>
      <label class="field" for="missing">Is anything important about how you work missing? (write none if nothing)</label>
      <textarea id="missing">${esc(ui.refl.missing)}</textarea>
      <h3 style="margin-top:18px">Optional: add something it missed</h3>
      ${ui.added.map((a, i) => `<div class="card"><div class="row">
        <input type="text" data-add="${i}" data-k="title" placeholder="Short title" value="${esc(a.title)}" style="flex:2;min-width:180px">
        <select data-add="${i}" data-k="type" style="flex:1;min-width:120px"><option value="skill" ${a.type === "skill" ? "selected" : ""}>skill</option><option value="principle" ${a.type === "principle" ? "selected" : ""}>principle</option></select></div>
        <label class="field">When it applies</label><input type="text" data-add="${i}" data-k="when" value="${esc(a.when)}">
        <label class="field">What to do</label><input type="text" data-add="${i}" data-k="instruction" value="${esc(a.instruction)}"></div>`).join("")}
      <button id="addone">+ Add one</button>
      <div class="sticky row spread"><span class="small mut" id="left"></span><button class="primary" id="save">Save and continue →</button></div>
    </div>`;
  const left = () => { const n = S.cards.filter((c) => !(ui.dec[c.card_id] || {}).decision).length;
    $("left").textContent = n ? `${n} item${n > 1 ? "s" : ""} still need keep, edit or delete` : "All items decided"; };
  const keepText = () => { ui.refl.surprise = $("surprise").value; ui.refl.missing = $("missing").value; };
  document.querySelectorAll("[data-dec]").forEach((b) => b.onclick = () => {
    keepText(); showError(""); const id = b.dataset.dec; ui.dec[id] = {...(ui.dec[id] || {}), decision: b.dataset.v}; confirm(); });
  document.querySelectorAll("[data-edit]").forEach((t) => t.oninput = () => ui.dec[t.dataset.edit][t.dataset.k] = t.value);
  document.querySelectorAll("[data-comment]").forEach((t) => t.oninput = () => {
    const id = t.dataset.comment; ui.dec[id] = {...(ui.dec[id] || {}), comment: t.value}; });
  document.querySelectorAll("[data-add]").forEach((t) => t.oninput = t.onchange = () => ui.added[+t.dataset.add][t.dataset.k] = t.value);
  $("addone").onclick = () => { keepText(); ui.added.push({title: "", type: "skill", when: "", instruction: ""}); confirm(); };
  $("save").onclick = (e) => {
    keepText();
    if (S.cards.some((c) => !(ui.dec[c.card_id] || {}).decision)) return showError("Choose keep, edit or delete for every item.");
    if (!ui.refl.surprise.trim() || !ui.refl.missing.trim()) return showError("Answer both questions (write none if nothing comes to mind).");
    act("confirm", {decisions: ui.dec, reflection: ui.refl, added: ui.added}, e.target);
  };
  left();
}

/* ---------------------------------------------------------------- 5 choose */
function choose() {
  ui.pick = ui.pick || "";
  const label = {keep: "kept", edit: "kept, edited", delete: "deleted"};
  $("view").innerHTML = `
    <div class="panel">
      <h1>Which set is the better one to keep?</h1>
      <p>These are the same items you just judged one by one, now split into the two groups they came from. Each group was
      made by a different method, shown without saying which is which. Imagine you keep
      one set as the standing instructions your AI assistant carries into all your future work, and it grows over time.
      Which is the better starting point: the one that sounds most like you, is most useful, and is worth building on?</p>
      <div class="sets">${["X", "Y"].map((L) => `<div class="card"><h2>Set ${L}</h2><ul>${S.sets[L].map((c) =>
        `<li><b>${esc(c.title)}</b> <span class="badge">${esc(c.type)}</span><br><span class="small">${esc(c.instruction)}</span>
        <br><span class="status">you ${esc(label[c.decision] || c.decision)} it</span></li>`).join("") || "<li class='mut'>No items</li>"}</ul></div>`).join("")}</div>
      <div class="row">${[["x", "Set X"], ["y", "Set Y"], ["same", "Same: no real difference"], ["neither", "Neither: I would keep neither"]].map(([v, l]) =>
        `<button class="chip ${ui.pick === v ? "on" : ""}" data-pick="${v}">${l}</button>`).join("")}</div>
      <label class="field" for="reason">In one line, why? (required)</label>
      <input type="text" id="reason" value="${esc(ui.reason || "")}">
      <label class="field" for="comments">Anything else about the study, such as a confusing step or how long it took? (optional)</label>
      <textarea id="comments">${esc(ui.comments || "")}</textarea>
      <div class="sticky row spread"><span></span><button class="primary" id="save">Save my choice →</button></div>
    </div>`;
  document.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => {
    ui.reason = $("reason").value; ui.comments = $("comments").value; ui.pick = b.dataset.pick; showError(""); choose(); });
  $("save").onclick = (e) => {
    const reason = $("reason").value.trim();
    if (!ui.pick || !reason) return showError("Choose X, Y, same or neither, and write one line on why.");
    act("choose", {pick: ui.pick, reason, comments: $("comments").value}, e.target);
  };
}

/* ---------------------------------------------------------------- 6 done */
function done() {
  const how = {direct: "one pass over your messages with skill-writing guidance, as you would do it today",
               structured: "found where you corrected the assistant, kept only rules that recur in two or more chats, dropped rules you later reversed, and checked for counterexamples"};
  const picked = {x: `Set X (${S.sets.X})`, y: `Set Y (${S.sets.Y})`, same: "no real difference", neither: "neither set"}[S.pick];
  $("view").innerHTML = `
    <div class="panel">
      <h1>Thank you, you are done</h1>
      <h3>Which method made which set</h3>
      <p><b>Set X = ${esc(S.sets.X)}</b>: ${esc(how[S.sets.X])}.</p>
      <p><b>Set Y = ${esc(S.sets.Y)}</b>: ${esc(how[S.sets.Y])}.</p>
      <p>You chose <b>${esc(picked)}</b>.</p>
    </div>
    <div class="panel">
      <h2>Last step: upload one file</h2>
      <ol>
        <li>Open the folder and look through the three <code>.share.csv</code> files if you like. They hold your choices
        and short reasons, never your messages, tasks, answers or the skill texts. If you delete a row, run
        <code>python3 study.py bundle</code> once more afterwards.</li>
        <li>Upload <code>study_files.zip</code> at <a href="${esc(S.upload)}" target="_blank" rel="noopener">the course drop folder</a> (no login; the file is named with a random code, not your name).</li>
      </ol>
      <div class="row"><button class="primary" id="folder">Open the folder</button><button id="skills">Open my kept skills</button></div>
      <p class="small mut" style="margin-top:14px">Zip: <code>${esc(S.zip)}</code></p>
      <p class="small mut">Your kept skills are ready to use in <code>${esc(S.skills)}</code> (see the README there). You can close this
      page and press Ctrl+C in the terminal.</p>
    </div>`;
  $("folder").onclick = () => api("open", {what: "folder"}).catch((e) => showError(e.message));
  $("skills").onclick = () => api("open", {what: "skills"}).catch((e) => showError(e.message));
}

refresh();
</script>
</body>
</html>
